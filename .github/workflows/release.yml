name: .NET Release

on:
  push:
    tags:
      - 'v*' # 'v'로 시작하는 태그에 대해 실행 (예: v1.0, v2.1.1)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # GitHub Releases에 업로드하기 위해 필요

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # 프로젝트의 .NET 버전에 맞게 수정

    - name: Restore dependencies
      run: dotnet restore LogCatViewer/LogCatViewer.csproj

    - name: Build
      run: dotnet publish LogCatViewer/LogCatViewer.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

    - name: Archive production artifacts
      shell: pwsh
      run: |
        $ARTIFACT_NAME = "LogCatViewer-${{ github.ref_name }}"
        $RELEASE_DIR = "LogCatViewer/bin/Release/net8.0-windows/win-x64/publish"
        Compress-Archive -Path "$RELEASE_DIR/*" -DestinationPath "$ARTIFACT_NAME.zip"
        echo "ARTIFACT_PATH=$ARTIFACT_NAME.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.ARTIFACT_PATH }}
        asset_name: ${{ env.ARTIFACT_PATH }}
        asset_content_type: application/zip
